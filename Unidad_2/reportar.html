<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Animal Rescatado</title>
</head>
<body>
    <header>
        <h1>Reportar animal rescatado</h1>
        <p>Registra un nuevo caso de rescate animal.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar animal</a></li>
            <li><a href="rescates.html">Lista de rescates</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulario de rescate</h2>
            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre provisional del animal:</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </p>

                <p>
                    <label for="categoria">Categoría del animal:</label><br>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="Perros">Perros</option>
                        <option value="Gatos">Gatos</option>
                        <option value="Fauna Silvestre">Fauna Silvestre</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Urgencia del rescate:</legend>
                    <input type="radio" id="urgencia-alta" name="urgencia" value="Alta" required>
                    <label for="urgencia-alta">Alta</label><br>

                    <input type="radio" id="urgencia-media" name="urgencia" value="Media">
                    <label for="urgencia-media">Media</label><br>

                    <input type="radio" id="urgencia-baja" name="urgencia" value="Baja">
                    <label for="urgencia-baja">Baja</label>
                </fieldset>

                <p>
                    <label for="descripcion">Descripción del estado del animal:</label><br>
                    <textarea id="descripcion" name="descripcion" rows="5" cols="40" required></textarea>
                </p>

                <p>
                    <button type="submit">Registrar rescate</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Actividad 3 - Desarrollo de Sistemas Informáticos</p>
    </footer>
</body>
</html>
